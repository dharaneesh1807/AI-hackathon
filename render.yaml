services:
  - type: web
    name: catalyst-eldercare
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn backend.main:create_from_env --factory --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: SCHEDULER_SECRET
        generateValue: true
      - key: DEMO_EMAIL_ALLOWLIST
        sync: false
